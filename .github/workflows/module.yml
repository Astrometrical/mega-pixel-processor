# Builds the PixInsight module (BigTIFF-pxm) + mpp-ipc-worker against the
# pinned open-source PCL, with NO PixInsight on the runner. All three
# targets -- Linux (x64), macOS (arm64), and Windows (x64) -- are live,
# required build+test jobs.
#
# Adapted from MergeMosaic's .github/workflows/module.yml (mmm-pxm ->
# BigTIFF-pxm, mmm-ipc-worker -> mpp-ipc-worker, mmm-core/mmm-ipc-worker ->
# mpp-ipc/mpp-ipc-worker crates, the pcl-ci build steps call mpp's own
# integration/pixinsight/ci/build-pcl*.{sh,ps1} scripts). Deliberately
# SIMPLER than MergeMosaic's current workflow: no update-repository package
# generation/updates.xri (integration/pixinsight/repo/** has no mpp
# equivalent and is out of scope for this task) and no module signing --
# MergeMosaic's own signing is dormant pending its CPD certificate, and this
# workflow doesn't even stage the not-yet-existing dormant-signing plumbing.
# Signing and repository publishing remain explicitly out of scope until a
# CPD certificate exists (see docs/DESIGN.md "Licensing constraints" and the
# plan's Task 6/"Out of scope" notes).
#
# KNOWN GAP: the "windows" job's module-build step is expected to fail on
# its first real run -- mpp's integration/pixinsight/module/ has no
# Windows/MSVC build system yet (only module/makefile-x64, used for Linux
# and macOS; see build-module-windows.ps1's header comment). Everything
# before that step (PCL build/cache, Rust tests, host CTest suite) still
# runs and gates real signal; only the final module-specific step is
# expected to fail until a future task adds the module's CMake/MSVC project.
name: Module

on:
  push:
    paths:
      - "integration/pixinsight/**"
      - "crates/mpp-ipc/**"
      - "crates/mpp-ipc-worker/**"
      - ".github/workflows/module.yml"
  pull_request:
    paths:
      - "integration/pixinsight/**"
      - "crates/mpp-ipc/**"
      - "crates/mpp-ipc-worker/**"
      - ".github/workflows/module.yml"
  workflow_dispatch:

concurrency:
  group: module-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: build+test (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Read PCL pin
        id: pcl
        run: |
          . integration/pixinsight/ci/pcl-pin.env
          echo "sha=$PCL_SHA" >> "$GITHUB_OUTPUT"

      # Cache key includes a hash of build-pcl.sh (not just the pinned SHA)
      # so a script fix that changes the build output invalidates the cache
      # too -- brief: "pcl-pin cache keyed on SHA + build-script hash".
      - name: Cache libPCL-pxi.a (keyed on PCL commit + build script)
        id: pcl-cache
        uses: actions/cache/restore@v4
        with:
          path: pcl-ci
          key: pcl-${{ runner.os }}-${{ steps.pcl.outputs.sha }}-${{ hashFiles('integration/pixinsight/ci/build-pcl.sh') }}

      - name: Build PCL (on cache miss)
        if: steps.pcl-cache.outputs.cache-hit != 'true'
        run: bash integration/pixinsight/ci/build-pcl.sh --out "$PWD/pcl-ci"

      - name: Save libPCL-pxi.a cache (only after a successful build)
        if: steps.pcl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: pcl-ci
          key: pcl-${{ runner.os }}-${{ steps.pcl.outputs.sha }}-${{ hashFiles('integration/pixinsight/ci/build-pcl.sh') }}

      # Runs the module build gates, builds the release worker, runs the
      # host CTest golden suite against it, and stages stage/bin + stage/doc
      # -- all in one script (verified locally end-to-end for this task; see
      # the Task 6 report). This differs from MergeMosaic's current
      # workflow, which runs CTest as its own separate step -- consolidated
      # here per this task's brief so `bash build-module-linux.sh` alone is
      # a complete local repro of everything this job gates on.
      - name: Build module + worker, run host CTest, stage payload
        run: |
          bash integration/pixinsight/ci/build-module-linux.sh \
            --pcl-inc "$PWD/pcl-ci/include" --pcl-lib "$PWD/pcl-ci/lib" \
            --stage "$PWD/stage"

      - name: Rust tests (ipc crates; a future workspace-wide CI job owns full coverage)
        run: cargo test -p mpp-ipc -p mpp-ipc-worker

      - name: Write bundle provenance
        run: printf 'sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > bundle-info.txt

      # bundle-info.txt is a second upload root on purpose: upload-artifact
      # stores files relative to the least common ancestor of the matched
      # paths, so a lone stage/bin/** root would flatten the payload to the
      # artifact root. The extra root pins the ancestor at the workspace
      # root, preserving stage/bin/... -- the bundle-contract layout a
      # future consumer (an Astrometrical distribution repo, mirroring
      # MergeMosaic's own) would expect.
      - name: Upload unsigned module artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mpp-pxm-linux-x64
          path: |
            stage/bin/**
            stage/doc/**
            bundle-info.txt
          if-no-files-found: error

  macos:
    name: build+test (macos-arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Read PCL pin
        id: pcl
        run: |
          . integration/pixinsight/ci/pcl-pin.env
          echo "sha=$PCL_SHA" >> "$GITHUB_OUTPUT"

      - name: Cache libPCL-pxi.a + 3rdparty (keyed on PCL commit + build script)
        id: pcl-cache
        uses: actions/cache/restore@v4
        with:
          path: pcl-ci
          key: pcl-${{ runner.os }}-${{ steps.pcl.outputs.sha }}-${{ hashFiles('integration/pixinsight/ci/build-pcl-macos.sh') }}

      - name: Build PCL (on cache miss)
        if: steps.pcl-cache.outputs.cache-hit != 'true'
        run: bash integration/pixinsight/ci/build-pcl-macos.sh --out "$PWD/pcl-ci"

      - name: Save libPCL-pxi.a + 3rdparty cache (only after a successful build)
        if: steps.pcl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: pcl-ci
          key: pcl-${{ runner.os }}-${{ steps.pcl.outputs.sha }}-${{ hashFiles('integration/pixinsight/ci/build-pcl-macos.sh') }}

      - name: Confirm PCL archive
        run: test -f "$PWD/pcl-ci/lib/libPCL-pxi.a"

      # Same consolidation as the linux job -- see its comment above.
      - name: Build module + worker, run host CTest, stage payload
        run: |
          bash integration/pixinsight/ci/build-module-macos.sh \
            --pcl-inc "$PWD/pcl-ci/include" --pcl-lib "$PWD/pcl-ci/lib" \
            --stage "$PWD/stage"

      - name: Rust tests (ipc crates)
        run: cargo test -p mpp-ipc -p mpp-ipc-worker

      - name: Write bundle provenance
        run: printf 'sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > bundle-info.txt

      # Second upload root pins the least-common-ancestor at the workspace
      # root so stage/bin/... survives in the artifact (see the linux job).
      - name: Upload unsigned module artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mpp-pxm-macos-arm64
          path: |
            stage/bin/**
            stage/doc/**
            bundle-info.txt
          if-no-files-found: error

  windows:
    name: build+test (windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust (msvc)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Read PCL pin
        id: pcl
        shell: bash
        run: |
          . integration/pixinsight/ci/pcl-pin.env
          echo "sha=$PCL_SHA" >> "$GITHUB_OUTPUT"

      - name: Cache PCL-pxi.lib + 3rdparty (keyed on PCL commit + build script)
        id: pcl-cache
        uses: actions/cache/restore@v4
        with:
          path: pcl-ci
          key: pcl-${{ runner.os }}-${{ steps.pcl.outputs.sha }}-${{ hashFiles('integration/pixinsight/ci/build-pcl-windows.ps1', 'integration/pixinsight/ci/win/PCL.vcxproj') }}

      - name: Build PCL (on cache miss)
        if: steps.pcl-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: integration/pixinsight/ci/build-pcl-windows.ps1 -Out "$PWD/pcl-ci"

      - name: Save PCL-pxi.lib + 3rdparty cache (only after a successful build)
        if: steps.pcl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: pcl-ci
          key: pcl-${{ runner.os }}-${{ steps.pcl.outputs.sha }}-${{ hashFiles('integration/pixinsight/ci/build-pcl-windows.ps1', 'integration/pixinsight/ci/win/PCL.vcxproj') }}

      - name: Confirm PCL archive
        shell: pwsh
        run: |
          if (-not (Test-Path "$PWD/pcl-ci/lib/PCL-pxi.lib")) { exit 1 }
          if (-not (Test-Path "$PWD/pcl-ci/lib/lcms-pxi.lib")) { exit 1 }

      - name: Rust tests (ipc crates)
        run: cargo test -p mpp-ipc -p mpp-ipc-worker

      # Unlike linux/macos, ctest here is its own step *before* the module
      # build (MMM's own windows job order; the brief calls this out
      # explicitly: "Windows per MMM's pattern"). It needs a worker binary
      # to point MPP_WORKER_EXE at; build one explicitly (debug is fine --
      # the host protocol doesn't care about optimization level) rather than
      # relying on `cargo test` having built it as a side effect.
      - name: Build worker (debug, for the host CTest suite)
        run: cargo build -p mpp-ipc-worker

      # pwsh (not bash) deliberately: MPP_WORKER_EXE must reach the C++ test
      # binary as a native Windows path, and git-bash's $PWD is POSIX-style
      # (e.g. /d/a/repo/repo) with no guaranteed auto-translation for a
      # plain environment-variable assignment (unlike PATH or argv path
      # heuristics) -- pwsh's $PWD/Join-Path avoids that ambiguity entirely.
      - name: Host golden CTest suite (no PixInsight)
        shell: pwsh
        run: |
          cmake -S integration/pixinsight/host -B integration/pixinsight/host/ci-build
          cmake --build integration/pixinsight/host/ci-build --config Release
          $env:MPP_WORKER_EXE = Join-Path $PWD 'target/debug/mpp-ipc-worker.exe'
          ctest --test-dir integration/pixinsight/host/ci-build --build-config Release --output-on-failure

      # KNOWN GAP: expected to fail here until a future task adds a
      # module/CMakeLists.txt (MSVC build) for mpp -- see this script's
      # header comment. Left live (not continue-on-error) so the gap stays
      # visible in CI rather than silently masked.
      - name: Build module + worker, stage payload
        shell: pwsh
        run: integration/pixinsight/ci/build-module-windows.ps1 -PclInc "$PWD/pcl-ci/include" -PclLib "$PWD/pcl-ci/lib" -Stage "$PWD/stage"

      - name: Write bundle provenance
        shell: bash
        run: printf 'sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > bundle-info.txt

      # Second upload root pins the least-common-ancestor at the workspace
      # root so stage/bin/... survives in the artifact (see the linux job).
      - name: Upload unsigned module artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mpp-pxm-windows-x64
          path: |
            stage/bin/**
            stage/doc/**
            bundle-info.txt
          if-no-files-found: error
