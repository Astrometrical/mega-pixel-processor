[package]
name = "mpp-core"
description = "Mega Pixel Processor engine — big astro image conversion, WCS carriage, DZI export"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
memmap2.workspace = true
bytemuck.workspace = true
quick-xml.workspace = true
serde.workspace = true
# float_roundtrip: f64 values (solutions, headers) survive JSON exactly.
serde_json = { workspace = true, features = ["float_roundtrip"] }
tiff = { workspace = true, optional = true }
# XISF block compression codecs (always on: the lean core reads compressed XISF).
flate2.workspace = true
lz4_flex.workspace = true
zstd.workspace = true
# XISF block checksums (SHA-1/SHA-2 required by the spec, SHA-3 optional).
sha1.workspace = true
sha2.workspace = true
sha3.workspace = true

[features]
# Everything on by default for the mpp CLI and PixInsight worker. Format
# consumers (mmm) take `default-features = false`: XISF/FITS reading and
# writing, the Header model, astrometry and WCS, with no TIFF or vips code.
default = ["tiff", "convert", "publish"]
# TIFF/BigTIFF reader and writer (and the ordered work pipeline behind them).
tiff = ["dep:tiff"]
# One-call conversion orchestration (`convert`) and the `vips` CLI bridge.
convert = ["tiff"]
# DZI / single-image publishing (`publish`) and the viewer page.
publish = ["convert"]

[[example]]
name = "tiff_bench"
required-features = ["tiff"]

