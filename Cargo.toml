[workspace]
resolver = "3"
members = ["crates/mpp-core", "crates/mpp", "crates/mpp-ipc", "crates/mpp-ipc-worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Astrometrical <https://github.com/Astrometrical>"]
repository = "https://github.com/Astrometrical/mega-pixel-processor"

[workspace.dependencies]
mpp-core = { path = "crates/mpp-core" }
mpp-ipc = { path = "crates/mpp-ipc" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
memmap2 = "0.9"
bytemuck = "1"
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.11"
nix = { version = "0.29", features = ["mman", "fs"] }
libc = "0.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    # Required: CreateFileMappingW's signature references SECURITY_ATTRIBUTES
    # (Win32_Security); without it shm compilation fails (E0432). Provenance:
    # verified empirically in MMM (mmm-core/Cargo.toml comment).
    "Win32_Security",
    "Win32_System_Memory",
] }

# Pixel transforms are hot-path; always optimize dependencies even in dev builds
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
